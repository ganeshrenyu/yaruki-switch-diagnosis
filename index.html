</script><script>'use strict';
const rhythms = {
 morning: ['朝型傾向','朝のスタートタイプ','朝の時間帯に活動しやすい傾向があります。午前中に大切な予定を置く方法を試してみましょう。'],

};
const behaviors = {
 start: ['始動サポート型','最初の一歩がカギ','始めるきっかけがあると動きやすくなる傾向があります。','取り組むことを一つ選び、最初の5分だけ試してみましょう。','なかなか始められない自分を動かす攻略BOOK'],

 recovery: ['回復優先型','余力を残すことがカギ','疲れや負担に合わせたペース配分が役立つ傾向があります。','今日の予定を見直し、休憩や余白を一つ確保してみましょう。','頑張りすぎずに動くための回復攻略BOOK'],
 environment: ['環境サポート型','整えることがカギ','優先順位や手順を明確にすると動きやすくなる傾向があります。','気になる用事を書き出し、今日の最優先を一つ決めてみましょう。','迷わず動ける自分になるための環境攻略BOOK']
};
function highestCategories(scores) {
 return Object.keys(scores).filter(k=>scores[k]===Math.max(...Object.values(scores)));
}
function scoreAnswers(answers) {
 if (answers.length !== 12 || window.QUESTIONS.some((q,i) => !Number.isInteger(answers[i]) || !q.options[answers[i]])) throw new Error('全12問に回答してください。');
 const rhythm = Object.fromEntries(Object.keys(rhythms).map(k=>[k,0]));
 const behavior = Object.fromEntries(Object.keys(behaviors).map(k=>[k,0]));
 answers.forEach((answer,i)=>{ (i<4 ? rhythm : behavior)[window.QUESTIONS[i].options[answer].category]++; });
 return {rhythm,behavior,rhythmTypes:highestCategories(rhythm),behaviorTypes:highestCategories(behavior)};
}
function noteURL(category) {

}
const app = document.getElementById('app');
let answers = Array(12).fill(null), current = 0;
const escapeHTML = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function focusHeading() { app.querySelector('h1').focus(); window.scrollTo(0,0); }
function intro(moveFocus=false) {

}
function question() {

 app.querySelectorAll('input').forEach(input=>input.onchange=()=>{ answers[current]=Number(input.value); document.getElementById('next').disabled=false; });
 document.getElementById('back').onclick=()=>{if(current===0) intro(true);else {current--;question();}};
 app.querySelector('form').onsubmit=e=>{ e.preventDefault(); if(answers[current]===null)return; if(current===11) results();else {current++; question();} };
 focusHeading();
}
// Only adjacent two-time combinations use a range; larger mixes list every type.
function rhythmTitle(keys) {
 const names = {morning:'朝型', afternoon:'午後型', evening:'夜型', variable:'変動型'};
 if (keys.length === 2) {
  if (keys.includes('morning') && keys.includes('afternoon')) return '朝〜午後型';
  if (keys.includes('afternoon') && keys.includes('evening')) return '午後〜夜型';
 }
 return keys.map(k=>names[k]).join('＋');
}
function behaviorTitle(keys) {

}

 app.innerHTML=`<section class="results"><p class="eyebrow">YOUR CHECK-IN RESULT</p><p class="pill">今のあなたの傾向</p><h1 tabindex="-1">${rhythmTitle(r.rhythmTypes)}<span class="times"> × </span>${behaviorTitle(r.behaviorTypes)}</h1><p class="result-intro">自分を決めつけるためではなく、<br>動きやすくなるヒントとして受け取ってください。</p><section class="result-section"><h2><span>01</span> 活動リズム</h2>${r.rhythmTypes.length>1?'<p class="mix">ミックス傾向：最高点が同じタイプをすべて表示しています。</p>':''}${cards(r.rhythmTypes,rhythms)}</section><section class="result-section"><h2><span>02</span> 行動パターン</h2>${r.behaviorTypes.length>1?'<p class="mix">ミックス傾向：最高点が同じタイプをすべて表示しています。</p>':''}${cards(r.behaviorTypes,behaviors)}</section><section class="tips result-section"><p class="eyebrow">ONE SMALL STEP</p><h2>今日の攻略ヒント</h2><p>気になるものを一つ試してみてください。</p>${r.behaviorTypes.map(k=>`<article><h3>${behaviors[k][0]}</h3><p>${behaviors[k][3]}</p></article>`).join('')}</section><section class="result-section notes"><p class="eyebrow">もっと工夫を知りたい方へ</p><h2>あなたのペースで、もう一歩。</h2><p>有料noteの攻略BOOKで、日々の工夫を詳しく紹介します。</p>${r.behaviorTypes.length===2?'<p>両方購入する必要はありません。</p>':r.behaviorTypes.length>2?'<p>今いちばん気になるテーマから選べます。</p>':''}${r.behaviorTypes.map(k=>`<article class="note-card"><span class="small">${behaviors[k][0]} / 有料note</span><h3>${behaviors[k][4]}</h3><p class="small">300円予定</p>${noteURL(k)?`<a class="note-link" href="${escapeHTML(noteURL(k))}" target="_blank" rel="noopener noreferrer">noteで記事を見る ↗<span class="sr-only">（新しいタブで開きます）</span></a>`:'<p class="preparing">記事は準備中です</p>'}</article>`).join('')}</section><button id="restart" class="secondary restart">もう一度診断する ↻</button></section>`;
 document.getElementById('restart').onclick=()=>{answers=Array(12).fill(null);current=0;intro(true);};
 focusHeading();
